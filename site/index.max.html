<!doctype html>
<html lang="en-au">
    <head>
        <title>Hot Dog Clicker</title>
        <meta
            name="description"
            content="Hot Dog Clicker is a fun way to pass the time."
        />
        <meta name="og:title" property="og:title" content="Hot Dog Clicker" />
        <link rel="canonical" href="https://hdc.ljpprojects.org/" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="stylesheet" href="/dist/index-min.css" />
        <link rel="stylesheet" href="/dist/empty-min.css" />
    </head>

    <body>
        <nav>
            <button title="Main Menu">
                <img src="/assets/main-menu.svg" width="100" draggable="false" />
            </button>
            <button title="Save">
                <img src="/assets/save.svg" width="100" draggable="false" />
            </button>
            <button title="Wipe">
                <img src="/assets/wipe.svg" width="100" draggable="false" />
            </button>
        </nav>

        <main>
            <section class="splvert">
                <section class="card" id="stat">
                    <div>
                        <h2><span id="hds">0</span> hot dogs</h2>
                        <h2><span id="hdps">0</span> hot dogs per second</h2>
                        <h2>Net Worth: <span id="hdnw">0</span></h2>
                    </div>

                    <button id="hotdog-button">
                        <img
                            src="/assets/hotdog.svg"
                            alt="Hotdog"
                            draggable="false"
                        />
                    </button>
                </section>
                <section></section>
            </section>
            <section class="card" id="right-split">
                <h1>Hot Dog Clicker</h1>

                <ul id="buyables-list">
                    <li title="Butcher" id="butcher" data-unbuyable data-button>
                        <img src="/assets/butcher-u.svg" draggable="false" />
                        <div>
                            <b>Butcher</b>
                            <span id="butchers-owned">0</span>
                        </div>
                        <span id="butcher-price">15</span>
                    </li>
                    <li title="Stand" id="stand" data-unbuyable data-button>
                        <img src="/assets/stand-u.svg" draggable="false" />
                        <div>
                            <b>Stand</b>
                            <span id="stands-owned">0</span>
                        </div>
                        <span id="stand-price">250</span>
                    </li>
                    <li title="Cart" id="cart" data-unbuyable data-button>
                        <img src="/assets/cart-u.svg" draggable="false" />
                        <div>
                            <b>Cart</b>
                            <span id="carts-owned">0</span>
                        </div>
                        <span id="cart-price">1,000</span>
                    </li>
                    <li title="Food truck" id="truck" data-unbuyable data-button>
                        <img src="/assets/truck-u.svg" draggable="false" />
                        <div>
                            <b>Food truck</b>
                            <span id="trucks-owned">0</span>
                        </div>
                        <span id="truck-price">3,750</span>
                    </li>
                    <li title="Plantation" id="plantation" data-unbuyable data-button>
                        <img src="/assets/plantation-u.svg" draggable="false" />
                        <div>
                            <b>Plantation</b>
                            <span id="plantations-owned">0</span>
                        </div>
                        <span id="plantation-price">12,000</span>
                    </li>
                    <li title="Factory" id="factory" data-unbuyable data-button>
                        <img src="/assets/factory-u.svg" draggable="false" />
                        <div>
                            <b>Factory</b>
                            <span id="factories-owned">0</span>
                        </div>
                        <span id="factory-price">100,000</span>
                    </li>
                    <li title="Abattoir" id="abattoir" data-unbuyable data-button>
                        <img src="/assets/abattoir-u.svg" draggable="false" />
                        <div>
                            <b>Abattoir</b>
                            <span id="abattoirs-owned">0</span>
                        </div>
                        <span id="abattoir-price">750,000</span>
                    </li>
                    <li title="Restaurant" id="restaurant" data-unbuyable data-button>
                        <img src="/assets/restaurant-u.svg" draggable="false" />
                        <div>
                            <b>Restaurant</b>
                            <span id="restaurants-owned">0</span>
                        </div>
                        <span id="restaurant-price">2,750,000</span>
                    </li>
                    <li title="Franchise" id="franchise" data-unbuyable data-button>
                        <img src="/assets/franchise-u.svg" draggable="false" />
                        <div>
                            <b>Franchise</b>
                            <span id="franchises-owned">0</span>
                        </div>
                        <span id="franchise-price">27,000,000</span>
                    </li>
                </ul>
            </section>
        </main>

        <section class="dialogPopup hide" id="nicknameDialogContainer">
            <dialog id="nicknameDialog">
                <form method="dialog">
                    <p>Enter a nickname to be displayed on the leaderboard.</p>
                    <p>It must be</p>
                    <ul>
                        <li>Less than 16 characters</li>
                        <li>Non-empty</li>
                    </ul>
                    <input
                        type="text"
                        maxlength="15"
                        minlength="1"
                        placeholder="nickname"
                    />
                    <br />
                    <input type="submit" value="Cancel" />
                </form>
            </dialog>
        </section>
        <section class="dialogPopup hide" id="restoreDialogContainer">
            <dialog id="restoreDialog">
                <form method="dialog">
                    <p>Enter the identifier code of the save to restore.</p>
                    <input
                        type="text"
                        maxlength="44"
                        minlength="44"
                        placeholder="identifier code"
                    />
                    <br />
                    <input type="submit" value="Cancel" />
                </form>
            </dialog>
        </section>
        <section class="dialogPopup hide" id="notificationDialogContainer">
            <dialog id="notificationDialog">
                <form method="dialog">
                    <p id="notificationBody">If you are reading this, an error has occured.</p>
                    <br />
                    <input type="submit" value="OK" />
                </form>
            </dialog>
        </section>
        <section class="dialogPopup hide" id="settingsDialogContainer">
            <dialog id="settingsDialog">
                <b>Settings</b>

                <form method="dialog">
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 2vw;">
                        <p>Number format</p>
                        <select id="numberFormat">
                            <option>Normal</option>
                            <option>Compact</option>
                            <option>Scientific</option>
                        </select>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 2vw;">
                        <p>Number of digits (<span id="numberDigitsDisplay">2</span>)</p>
                        <input id="numberDigits" type="range" max="10" min="0" value="2" />
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 2vw;">
                        <p>Show tax popup</p>
                        <input type="checkbox" id="showTaxPopup" checked />
                    </div>
                    <br />
                    <input type="button" value="Cancel" id="settingsDialogCancel" />
                    <br />
                    <input type="submit" value="Confirm" />
                </form>
            </dialog>
        </section>
