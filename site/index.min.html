<!doctype html><html lang="en-au"><head><title>Hot Dog Clicker</title><meta name="description" content="Hot Dog Clicker is a fun way to pass the time."><meta name="og:title" property="og:title" content="Hot Dog Clicker"><link rel="canonical" href="https://hdc.ljpprojects.org/"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Playfair:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/dist/index.css"></head><body><nav class="display"><div><h1>Hot Dog Clicker</h1><h2>Hot Dogs: <span id="clickCount">0</span></h2><h2>Hot Dogs Per Second: <span id="passive">0</span></h2></div><button id="hotdogButton"><img src="./icons/Hotdog.svg" id="hotdogImage" alt="Hotdog" draggable="false"></button></nav><main class="display"><div id="store"><div id="buildings"><button id="bunButton"><b>Bun</b><div><span><p>0.2</p><small>hdps</small></span><div><div><span id="bunPrice">10</span> <small>hds</small></div><div><span id="bunCount">0</span> <small>owned</small></div></div></div></button> <button id="dadButton"><b>Dad</b><div><span><p>1</p><small>hdps</small></span><div><div><span id="dadPrice">100</span> <small>hds</small></div><div><span id="dadCount">0</span> <small>owned</small></div></div></div></button> <button id="grillButton"><b>Grill</b><div><span><p>7.5</p><small>hdps</small></span><div><div><span id="grillPrice">500</span> <small>hds</small></div><div><span id="grillCount">0</span> <small>owned</small></div></div></div></button> <button id="farmButton"><b>Farm</b><div><span><p>15</p><small>hdps</small></span><div><div><span id="farmPrice">5000</span> <small>hds</small></div><div><span id="farmCount">0</span> <small>owned</small></div></div></div></button> <button id="dogFacButton"><b>Factory</b><div><span><p>50</p><small>hdps</small></span><div><div><span id="facPrice">50000</span> <small>hds</small></div><div><span id="facCount">0</span> <small>owned</small></div></div></div></button> <button id="dogBankButton"><b>Bank</b><div><span><p>150</p><small>hdps</small></span><div><div><span id="bankPrice">250000</span> <small>hds</small></div><div><span id="bankCount">0</span> <small>owned</small></div></div></div></button> <button id="freezerButton"><b>Freezer</b><div><span><p>250</p><small>hdps</small></span><div><div><span id="freezerPrice">1000000</span> <small>hds</small></div><div><span id="freezerCount">0</span> <small>owned</small></div></div></div></button></div></div><script defer="defer" src="/dist/game.min.js"></script></main><div id="context" class="hide"><h1>Main Menu</h1><button id="wipe">WIPE</button><br><button id="save">SAVE</button><br></div></body></html>
